name: PR Benchmarks

# Runs BenchmarkDotNet on both the PR HEAD and the base branch tip, then posts
# a delta table as a PR comment (replacing it on each push).  Fails the PR if
# any benchmark regresses beyond BOTH the percentage threshold AND the absolute
# floor for that metric, unless the PR carries the perf-impact-acknowledged label.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/pr-benchmarks.yaml'

# Default to minimum permissions at the workflow level. The single job that
# needs pull-requests:write (the delta-comment poster) opts in explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_PROJECT: benchmarks/Wolfgang.Etl.Json.Benchmarks/Wolfgang.Etl.Json.Benchmarks.csproj
  BENCH_DIR: benchmarks/Wolfgang.Etl.Json.Benchmarks

jobs:
  benchmark-delta:
    name: BDN delta (HEAD vs base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required by the "Compute delta and post PR comment" step

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      # ── Base run ──────────────────────────────────────────────────────────

      - name: Run benchmarks on base (${{ github.event.pull_request.base.sha }})
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout "$BASE_SHA"
          dotnet restore "$BENCH_PROJECT"
          dotnet build -c Release --no-restore "$BENCH_PROJECT"
          cd "$BENCH_DIR"
          dotnet run -c Release --no-build -- --filter "*" --job short --memory --exporters json
          shopt -s nullglob
          reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No BDN JSON produced for base run"
            exit 1
          fi
          jq -s '{Title:"base",HostEnvironmentInfo:.[0].HostEnvironmentInfo,Benchmarks:[.[].Benchmarks[]]}' \
            "${reports[@]}" > /tmp/bdn-base.json

      # ── HEAD run ──────────────────────────────────────────────────────────

      - name: Run benchmarks on HEAD (${{ github.event.pull_request.head.sha }})
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout "$HEAD_SHA"
          rm -rf "$BENCH_DIR/BenchmarkDotNet.Artifacts"
          dotnet restore "$BENCH_PROJECT"
          dotnet build -c Release --no-restore "$BENCH_PROJECT"
          cd "$BENCH_DIR"
          dotnet run -c Release --no-build -- --filter "*" --job short --memory --exporters json
          shopt -s nullglob
          reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No BDN JSON produced for HEAD run"
            exit 1
          fi
          jq -s '{Title:"head",HostEnvironmentInfo:.[0].HostEnvironmentInfo,Benchmarks:[.[].Benchmarks[]]}' \
            "${reports[@]}" > /tmp/bdn-head.json

      # ── Delta + comment ───────────────────────────────────────────────────

      - name: Compute delta and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          MEAN_THRESHOLD: '20'
          ALLOC_THRESHOLD: '50'
          # Absolute floors. A benchmark regresses only when it crosses the
          # percentage threshold AND grows by more than the floor, so a large
          # ratio on a tiny absolute move (runner noise on a microsecond
          # benchmark, the ETL-Abstractions#367 false alarm) no longer fails.
          #
          # MEAN_FLOOR_NS = 25 us. The ItemCount=10 cases run in 2-9 us (gh-pages
          # dev/bench history, 43 runs), so a 20% blip there is under 2 us and
          # can never reach the floor. A genuine per-item regression shows up in
          # the ItemCount=1000 cases (178-900 us): +20% there is 36-180 us, which
          # clears 25 us. Smaller floors would let the 10-item cases fail on
          # noise; larger ones would hide a 20% regression in the fastest
          # 1000-item benchmark (JsonSingleStreamLoader, ~180 us at its minimum).
          #
          # ALLOC_FLOOR_BYTES = 1 KB. An extra allocation of a fixed size below
          # 1 KB per operation is not a per-item regression; a per-item one at
          # ItemCount=1000 adds at least 1000 x (object size) bytes and clears it.
          MEAN_FLOOR_NS: '25000'
          ALLOC_FLOOR_BYTES: '1024'
          EXEMPT_LABEL: perf-impact-acknowledged
        run: |
          node << 'NODEJS'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const base = JSON.parse(fs.readFileSync('/tmp/bdn-base.json', 'utf8'));
          const head = JSON.parse(fs.readFileSync('/tmp/bdn-head.json', 'utf8'));

          const baseLookup = Object.fromEntries(
            base.Benchmarks.map(b => [b.FullName, b])
          );

          const MEAN_THRESHOLD = parseFloat(process.env.MEAN_THRESHOLD);
          const ALLOC_THRESHOLD = parseFloat(process.env.ALLOC_THRESHOLD);
          const MEAN_FLOOR_NS = parseFloat(process.env.MEAN_FLOOR_NS);
          const ALLOC_FLOOR_BYTES = parseFloat(process.env.ALLOC_FLOOR_BYTES);
          for (const [name, value] of Object.entries({ MEAN_THRESHOLD, ALLOC_THRESHOLD, MEAN_FLOOR_NS, ALLOC_FLOOR_BYTES })) {
            if (!Number.isFinite(value) || value < 0) {
              console.error(`::error::${name} is not a non-negative number - the gate cannot run.`);
              process.exit(1);
            }
          }
          const EXEMPT_LABEL = process.env.EXEMPT_LABEL;
          const labels = JSON.parse(process.env.PR_LABELS || '[]');
          const isExempt = labels.includes(EXEMPT_LABEL);

          function fmtTime(ns) {
            if (ns < 1000) return ns.toFixed(1) + ' ns';
            if (ns < 1e6) return (ns / 1000).toFixed(2) + ' μs';
            if (ns < 1e9) return (ns / 1e6).toFixed(2) + ' ms';
            return (ns / 1e9).toFixed(3) + ' s';
          }

          function fmtBytes(b) {
            if (b === 0 || b === null || b === undefined) return '0 B';
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(2) + ' MB';
          }

          function fmtDelta(pct) {
            const sign = pct > 0 ? '+' : '';
            return sign + pct.toFixed(1) + '%';
          }

          // 🔴 only when the move fails the gate (ratio AND floor); a ratio breach
          // under the floor shows 🟡, so the table still flags it for a human.
          function trafficLight(pct, threshold, absDelta, floor) {
            if (pct > threshold && absDelta > floor) return '🔴';
            if (pct > threshold / 2) return '🟡';
            if (pct < -5) return '🟢';
            return '⚪';
          }

          const rows = [];
          let hasRegression = false;

          for (const hb of head.Benchmarks) {
            const bb = baseLookup[hb.FullName];
            if (!bb) continue;

            const headMean = hb.Statistics.Mean;
            const baseMean = bb.Statistics.Mean;
            const headAlloc = hb.Memory?.BytesAllocatedPerOperation ?? 0;
            const baseAlloc = bb.Memory?.BytesAllocatedPerOperation ?? 0;

            const deltaMean = baseMean > 0 ? ((headMean - baseMean) / baseMean * 100) : 0;
            const deltaAlloc = baseAlloc > 0 ? ((headAlloc - baseAlloc) / baseAlloc * 100) : 0;

            const absMean = headMean - baseMean;
            const absAlloc = headAlloc - baseAlloc;

            if ((deltaMean > MEAN_THRESHOLD && absMean > MEAN_FLOOR_NS) ||
                (deltaAlloc > ALLOC_THRESHOLD && absAlloc > ALLOC_FLOOR_BYTES)) {
              hasRegression = true;
            }

            const parts = hb.FullName.split('.');
            const shortName = parts.slice(-2).join('.');

            rows.push(
              `| ${shortName} ` +
              `| ${fmtTime(baseMean)} | ${fmtTime(headMean)} | ${trafficLight(deltaMean, MEAN_THRESHOLD, absMean, MEAN_FLOOR_NS)} ${fmtDelta(deltaMean)} ` +
              `| ${fmtBytes(baseAlloc)} | ${fmtBytes(headAlloc)} | ${trafficLight(deltaAlloc, ALLOC_THRESHOLD, absAlloc, ALLOC_FLOOR_BYTES)} ${fmtDelta(deltaAlloc)} |`
            );
          }

          const baseSha = process.env.BASE_SHA.slice(0, 7);
          const headSha = process.env.HEAD_SHA.slice(0, 7);

          let verdict;
          if (hasRegression && !isExempt) {
            verdict = `> ⚠️ **Regression detected.** At least one benchmark exceeded the threshold (mean >${MEAN_THRESHOLD}% and >${fmtTime(MEAN_FLOOR_NS)}, or alloc >${ALLOC_THRESHOLD}% and >${fmtBytes(ALLOC_FLOOR_BYTES)}). Add the \`${EXEMPT_LABEL}\` label to acknowledge intentional perf impact.`;
          } else if (hasRegression) {
            verdict = `> ℹ️ Regression present but acknowledged via \`${EXEMPT_LABEL}\` label.`;
          } else {
            verdict = '> ✅ No regressions detected.';
          }

          const body = [
            '<!-- bdn-delta -->',
            '## BenchmarkDotNet — PR delta',
            '',
            `Comparing \`${baseSha}\` (base) → \`${headSha}\` (HEAD)`,
            `Thresholds: mean >${MEAN_THRESHOLD}% and >${fmtTime(MEAN_FLOOR_NS)} = 🔴, alloc >${ALLOC_THRESHOLD}% and >${fmtBytes(ALLOC_FLOOR_BYTES)} = 🔴`,
            '',
            '| Benchmark | Base mean | HEAD mean | Δ mean | Base alloc | HEAD alloc | Δ alloc |',
            '|-----------|----------:|----------:|-------:|-----------:|-----------:|--------:|',
            ...rows,
            '',
            verdict,
          ].join('\n');

          fs.writeFileSync('/tmp/bdn-comment.json', JSON.stringify({ body }));

          const existing = execFileSync('gh', [
            'api', `repos/${process.env.REPO}/issues/${process.env.PR_NUMBER}/comments`,
            '--jq', '[.[] | select(.body | startswith("<!-- bdn-delta -->"))] | first | .id // empty',
          ], { encoding: 'utf8' }).trim();

          if (existing) {
            execFileSync('gh', [
              'api', `repos/${process.env.REPO}/issues/comments/${existing}`,
              '--method', 'PATCH', '--input', '/tmp/bdn-comment.json',
            ]);
            console.log('Updated comment', existing);
          } else {
            execFileSync('gh', [
              'api', `repos/${process.env.REPO}/issues/${process.env.PR_NUMBER}/comments`,
              '--method', 'POST', '--input', '/tmp/bdn-comment.json',
            ]);
            console.log('Posted new comment');
          }

          if (hasRegression && !isExempt) {
            console.error('::error::Performance regression detected — see PR comment for details');
            process.exit(1);
          }
          NODEJS
