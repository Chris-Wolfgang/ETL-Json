# AOT / trim publish smoke test.
#
# Publishes examples/Wolfgang.Etl.Json.Example.AotSmoke with
# <PublishAot>true</PublishAot> + <PublishTrimmed>true</PublishTrimmed>
# and runs the resulting native binary. Surfaces IL2xxx / AOT0xxx /
# IL3xxx warnings so we know which library surfaces the trimmer /
# AOT compiler can't see through.
#
# The library's JsonTypeInfo<T> overloads (used by the smoke example)
# carry [RequiresDynamicCode] / [RequiresUnreferencedCode] guards on the
# reflection-based overloads, so AOT-clean paths are explicitly marked.
# This workflow verifies those paths produce a runnable binary.
#
# Status: INFORMATIONAL / NON-BLOCKING today (continue-on-error).
# Refs #130.
name: AOT + trim smoke

# Uses `pull_request` (not `pull_request_target`): this workflow only
# builds and runs example code, never publishes or authenticates as the
# repository, so running with PR-scoped permissions is the right default.
# See pr.yaml for the pull_request_target rationale that applies where
# workflow-YAML immutability across PRs matters.
on:
  pull_request:
    # No paths filter: the check reports on every PR, so it can later become a required
    # status check (a path-skipped workflow never reports and would block the merge).
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/Wolfgang.Etl.Json.Example.AotSmoke/**"
      - ".github/workflows/aot-smoke.yaml"
  workflow_dispatch:

# Top-level minimum permissions. Individual jobs opt in to more where needed.
concurrency:
  group: aot-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aot-smoke:
    name: PublishAot + PublishTrimmed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore examples/Wolfgang.Etl.Json.Example.AotSmoke/Wolfgang.Etl.Json.Example.AotSmoke.csproj

      # PublishAot / PublishTrimmed / TrimmerSingleWarn live in the AotSmoke csproj, not on this
      # command line: a -p: property on the command line is global and flows into every
      # referenced project, including the library's net462 target, where AOT is unsupported
      # (NETSDK1207). That made this step fail every time, so the binary was never built or run.
      - name: Publish (PublishAot + PublishTrimmed)
        id: publish
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p publish
          dotnet publish \
            examples/Wolfgang.Etl.Json.Example.AotSmoke/Wolfgang.Etl.Json.Example.AotSmoke.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output publish \
            2>&1 | tee publish.log

      - name: Summarize trim / AOT warnings
        if: always()
        run: |
          {
            echo "## AOT + trim smoke — warning summary"
            echo ""
            if [ ! -f publish.log ]; then
              echo "publish step produced no log — likely errored before running dotnet."
              exit 0
            fi
            il2_count=$(grep -c -E "(warning|error) IL2" publish.log || true)
            il3_count=$(grep -c -E "(warning|error) IL3" publish.log || true)
            aot_count=$(grep -c -E "(warning|error) AOT" publish.log || true)
            echo "| Category | Count |"
            echo "|---|---|"
            echo "| Trim (IL2xxx) | $il2_count |"
            echo "| Single-file (IL3xxx) | $il3_count |"
            echo "| AOT (AOT0xxx) | $aot_count |"
            echo ""
            if [ "$il2_count" -gt 0 ] || [ "$il3_count" -gt 0 ] || [ "$aot_count" -gt 0 ]; then
              echo "<details><summary>First 20 warnings</summary>"
              echo ""
              echo '```'
              grep -E "(warning|error) (IL[23]|AOT)" publish.log | head -20
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "**Gate mode**: non-blocking (informational). Promote to blocking once IL2xxx count reaches zero."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the AOT-published binary
        if: steps.publish.outcome == 'success'
        # Informational, like the publish step: report a crash without failing the job.
        continue-on-error: true
        run: |
          bin=publish/Wolfgang.Etl.Json.Example.AotSmoke
          if [ ! -x "$bin" ]; then
            echo "::warning::AOT-published binary not found at $bin — publish output layout may have changed."
            exit 0
          fi
          "$bin"

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aot-smoke-publish-log
          path: publish.log
          retention-days: 30

  # linux-arm64 leg (fleet standard: claude-sessions standards/test-matrix.md item 4). The native
  # binary is per-architecture, so the managed ARM64 stages in pr.yaml do not cover it. Same steps
  # as the linux-x64 job above (keep them in step), plus the clang/zlib prerequisites, which the
  # ubuntu-latest image has and the arm64 image may not. Its own job, not a matrix entry, so the
  # required check name of the linux-x64 job ("PublishAot + PublishTrimmed") does not change.
  # The arm64 runner is free on public repositories only, so a private repository skips it.
  aot-smoke-arm64:
    name: PublishAot + PublishTrimmed (linux-arm64)
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install Native AOT prerequisites
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1 \
            && dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q 'install ok installed'; then
            echo "clang ($(clang --version | head -n 1)) and zlib1g-dev are on the runner image; apt not needed."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y clang zlib1g-dev; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt of 3 failed; retrying in $((attempt * 30)) s."
            sleep $((attempt * 30))
          done
          echo "::error::clang and zlib1g-dev could not be installed after 3 apt attempts."
          exit 1

      - name: Restore
        run: dotnet restore examples/Wolfgang.Etl.Json.Example.AotSmoke/Wolfgang.Etl.Json.Example.AotSmoke.csproj

      # PublishAot / PublishTrimmed / TrimmerSingleWarn live in the AotSmoke csproj, not on this
      # command line: a -p: property on the command line is global and flows into every
      # referenced project, including the library's net462 target, where AOT is unsupported
      # (NETSDK1207). That made this step fail every time, so the binary was never built or run.
      - name: Publish (PublishAot + PublishTrimmed)
        id: publish
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p publish
          dotnet publish \
            examples/Wolfgang.Etl.Json.Example.AotSmoke/Wolfgang.Etl.Json.Example.AotSmoke.csproj \
            --configuration Release \
            --runtime linux-arm64 \
            --self-contained true \
            --output publish \
            2>&1 | tee publish.log

      - name: Summarize trim / AOT warnings
        if: always()
        run: |
          {
            echo "## AOT + trim smoke (linux-arm64) — warning summary"
            echo ""
            if [ ! -f publish.log ]; then
              echo "publish step produced no log — likely errored before running dotnet."
              exit 0
            fi
            il2_count=$(grep -c -E "(warning|error) IL2" publish.log || true)
            il3_count=$(grep -c -E "(warning|error) IL3" publish.log || true)
            aot_count=$(grep -c -E "(warning|error) AOT" publish.log || true)
            echo "| Category | Count |"
            echo "|---|---|"
            echo "| Trim (IL2xxx) | $il2_count |"
            echo "| Single-file (IL3xxx) | $il3_count |"
            echo "| AOT (AOT0xxx) | $aot_count |"
            echo ""
            if [ "$il2_count" -gt 0 ] || [ "$il3_count" -gt 0 ] || [ "$aot_count" -gt 0 ]; then
              echo "<details><summary>First 20 warnings</summary>"
              echo ""
              echo '```'
              grep -E "(warning|error) (IL[23]|AOT)" publish.log | head -20
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "**Gate mode**: non-blocking (informational). Promote to blocking once IL2xxx count reaches zero."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the AOT-published binary
        if: steps.publish.outcome == 'success'
        # Informational, like the publish step: report a crash without failing the job.
        continue-on-error: true
        run: |
          bin=publish/Wolfgang.Etl.Json.Example.AotSmoke
          if [ ! -x "$bin" ]; then
            echo "::warning::AOT-published binary not found at $bin — publish output layout may have changed."
            exit 0
          fi
          "$bin"

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aot-smoke-publish-log-linux-arm64
          path: publish.log
          retention-days: 30
