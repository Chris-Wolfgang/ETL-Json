name: Build reproducibility

# Verifies that the deterministic-build knobs in Directory.Build.props
# (<Deterministic>, <ContinuousIntegrationBuild>, SourceLink,
# EmbedUntrackedSources) actually produce byte-identical output when the same
# commit is built on different runners. The compiled assemblies and symbols
# (.dll/.pdb, every target framework) must be byte-identical across operating
# systems, or the job fails. Directory.Build.targets normalizes the
# SDK-generated sources to LF and Directory.Build.props pins the .NET
# Framework reference assemblies; those were the inputs that differed between
# Linux and Windows. Package files (.nupkg/.snupkg) are not compared: NuGet
# stamps each zip entry with the pack time, so they differ on every run.
# See docs/REPRODUCIBLE-BUILD.md.

on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 1'   # Mondays 05:40 UTC

permissions:
  contents: read

jobs:
  build:
    name: Build + hash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build src (every TFM, Release, deterministic)
        shell: bash
        run: |
          dotnet build src/Wolfgang.Etl.Json/Wolfgang.Etl.Json.csproj \
            -c Release -p:ContinuousIntegrationBuild=true

      - name: Hash assemblies and symbols
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src/Wolfgang.Etl.Json/bin/Release/*/Wolfgang.Etl.Json.dll
                 src/Wolfgang.Etl.Json/bin/Release/*/Wolfgang.Etl.Json.pdb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No Wolfgang.Etl.Json .dll/.pdb under bin/Release - nothing to compare."
            exit 1
          fi
          # One line per file, "<sha256>  <tfm>/<file>", so every TFM is compared.
          sha256sum "${files[@]}" \
            | awk '{ n = split($2, parts, "/"); print $1 "  " parts[n-1] "/" parts[n] }' \
            | sort -k2 > "hashes-${{ matrix.os }}.txt"
          echo "== ${{ matrix.os }} =="
          cat "hashes-${{ matrix.os }}.txt"

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.txt

  compare:
    name: Compare across runners
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: hashes

      - name: Diff manifests
        shell: bash
        run: |
          ubuntu="hashes/hashes-ubuntu-latest/hashes-ubuntu-latest.txt"
          windows="hashes/hashes-windows-latest/hashes-windows-latest.txt"
          echo "== ubuntu-latest =="; cat "$ubuntu"
          echo "== windows-latest =="; cat "$windows"
          # Hard failure. If this fails, diff the per-TFM .pdb documents and the
          # referenced-assembly records first: a generated source written with a
          # different newline, or a different reference assembly, was the cause that
          # Directory.Build.targets and Directory.Build.props now remove.
          if diff -u "$ubuntu" "$windows"; then
            echo "✅ Reproducible: assemblies and symbols match across ubuntu + windows."
          else
            echo "::error::Assemblies or symbols differ across runners — the build is not byte-identical cross-OS."
            exit 1
          fi
